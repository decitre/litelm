[build-system]
requires = [
    "setuptools>=82.0.1",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "lmlite"
description = "Browser-native LLM orchestration in JupyterLite"
readme = "README.md"
authors = [ {name = "Emmanuel Decitre", email = "590094+decitre@users.noreply.github.com"} ]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: WebAssembly :: Emscripten",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [ ]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "lmlite.__version__"}

[project.urls]
repository = "https://github.com/decitre/lmlite"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"lmlite" = [
    "notebooks/*.ipynb",
    "js/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-ra -q"
testpaths = [
    "tests",
]
norecursedirs = [
    "workspace",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
omit = [ ]

[tool.ruff]
line-length = 120
exclude = ["*.ipynb"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.src]
root = "src"
include = ["src"]

[bumpver]
current_version = "0.2.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"',
]
"src/lmlite/__init__.py" = [
    '__version__ = "{version}"'
]

[tool.pixi.workspace]
name = "lmlite"
channels = ["conda-forge"]
# Supported platforms: macOS and Linux only (Windows not supported)
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
xeus-python = "*"


[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"

[tool.pixi.feature.dev.pypi-dependencies]
bumpver = "*"
build = "*"
twine = "*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = ["dev"]
py311 = ["py311", "dev"]
py312 = ["py312", "dev"]
py313 = ["py313", "dev"]

[tool.pixi.pypi-dependencies]
lmlite = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests -vv --full-trace"
quick-test = "pytest tests --ignore=tests/test_notebooks.py"
test-notebooks = "pytest -vv --full-trace tests/test_notebooks.py"
test-all = "pixi run --environment py311 test; pixi run --environment py312 test; pixi run --environment py313 test"
coverage = "coverage run -m pytest --ignore=tests/test_notebooks.py && coverage report -m"
lint = "ruff check src tests scripts --fix && ruff format src tests scripts"
lint-check = "ruff check src tests scripts && ruff format src tests scripts --check"
bumpver = "bumpver update --set-version"
wheel = "rm -rf dist build; python -m build --sdist --wheel"
twine = "twine upload dist/*"
lite-build = { cmd = ["bash", "scripts/lite-build.sh"] }
